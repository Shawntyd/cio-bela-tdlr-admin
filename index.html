<!DOCTYPE html>
<html lang="en">
<head>

<title>Cio Bela — Owner Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8; --bark: #2C2016; --gold: #B8935A; --gold-light: #D4B896; --charcoal: #1A1410;
    --bg: var(--cream); --surface: #ffffff; --text: var(--bark); --text-soft: #6b5d4c;
    --border: #E4DBCB; --accent: var(--gold); --accent-strong: #96754a;
    --ok-bg: #eef1e5; --ok-text: #52642f; --danger: #a4432f;
    --shadow: 0 1px 2px rgba(44,32,22,0.06), 0 4px 16px rgba(44,32,22,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16120c; --surface: #211a12; --text: #EFE6D8; --text-soft: #b8a98f; --border: #3a2e20;
      --accent: var(--gold-light); --accent-strong: var(--gold-light);
      --ok-bg: #26301c; --ok-text: #c3d19a; --danger: #d9776a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16120c; --surface: #211a12; --text: #EFE6D8; --text-soft: #b8a98f; --border: #3a2e20;
    --accent: var(--gold-light); --accent-strong: var(--gold-light);
    --ok-bg: #26301c; --ok-text: #c3d19a; --danger: #d9776a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Jost', sans-serif; line-height: 1.5; min-height: 100vh; }
  h1, h2, h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; margin: 0 0 0.3em; color: var(--text); }
  h1 { font-size: 2.1rem; font-style: italic; }
  h2 { font-size: 1.5rem; }
  p { color: var(--text-soft); margin: 0 0 1em; }
  a { color: var(--accent-strong); }
  #topbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px; padding: 14px 20px; overflow-x: auto; }
  #topbar .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 1.15rem;
    white-space: nowrap; margin-right: 12px; text-decoration: none; color: var(--text); }
  #topbar nav { display: flex; gap: 4px; flex-wrap: nowrap; }
  #topbar a.tab { text-decoration: none; color: var(--text-soft); font-size: 0.85rem; padding: 7px 12px; border-radius: 20px; white-space: nowrap; border: 1px solid transparent; }
  #topbar a.tab.active { background: var(--accent); color: var(--charcoal); font-weight: 500; }
  #topbar a.tab:not(.active):hover { border-color: var(--border); }
  main { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
  .lede { font-size: 1.02rem; max-width: 62ch; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; box-shadow: var(--shadow); text-decoration: none; color: var(--text); display: block; }
  .card .tag { font-size: 0.72rem; color: var(--accent-strong); font-weight: 600; letter-spacing: 0.02em; }
  .card h3 { margin: 6px 0 6px; }
  .card p { margin: 0; font-size: 0.88rem; }
  .rule-note { background: var(--ok-bg); border-left: 3px solid var(--accent); border-radius: 4px; padding: 12px 16px; font-size: 0.85rem; color: var(--text); margin: 18px 0 26px; }
  .warn-note { background: #f6e5e0; border-left: 3px solid var(--danger); border-radius: 4px; padding: 12px 16px; font-size: 0.85rem; color: var(--text); margin: 18px 0 26px; }
  section.group { margin-bottom: 30px; }
  section.group h2 { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 4px; }
  .item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .item input[type=checkbox] { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--accent-strong); flex-shrink: 0; }
  .item label { cursor: pointer; font-size: 0.93rem; }
  .item.checked label { color: var(--text-soft); text-decoration: line-through; text-decoration-color: var(--border); }
  .ref-group { margin-bottom: 26px; }
  .ref-group h2 { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 4px; }
  .ref-group .cite { color: var(--text-soft); font-size: 0.78rem; margin-bottom: 10px; }
  details.ref { border-bottom: 1px solid var(--border); padding: 4px 0; }
  details.ref summary { cursor: pointer; padding: 8px 4px; font-size: 0.93rem; font-weight: 500; list-style: none; }
  details.ref summary::-webkit-details-marker { display: none; }
  details.ref summary::before { content: "+"; color: var(--accent-strong); font-weight: 600; margin-right: 10px; display: inline-block; width: 12px; }
  details.ref[open] summary::before { content: "\2212"; }
  details.ref .ref-body { padding: 2px 4px 14px 26px; font-size: 0.88rem; color: var(--text-soft); }
  input.search-bar { width: 100%; font-size: 0.95rem; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); margin: 4px 0 18px; }
  .empty-state { color: var(--text-soft); font-size: 0.88rem; padding: 24px 0; text-align: center; }
  footer.note { margin-top: 50px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--text-soft); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<script type="module">

(function(){

var CHECKLIST_GROUPS = [
  { title: "TDLR Establishment License", cite: "Tex. Occ. Code §1603.2201, §1603.355; 16 TAC §83.71", items: [
    "Establishment license current and posted in public view",
    "License type covers everything on the menu \u2014 confirm eyelash extension services are covered (it's a separate establishment license category from full-service, not automatically included)",
    "Renewal tracked ahead of the 2-year expiration",
    "No new service category added to the menu before confirming it's within the license's scope"
  ]},
  { title: "Practitioners & Contractors", cite: "16 TAC §§83.71(c), (e), 83.50(b); Tex. Occ. Code §1603.353(b)", items: [
    "Every practitioner's individual TDLR license verified active before they start working (tdlr.texas.gov license search)",
    "Current list of all independent contractors/renters kept on hand \u2014 name + license number + expiration date",
    "List available to hand an inspector on request",
    "No contractor operates from a fully enclosed, walled private room \u2014 that would need its own Mini-Establishment license (open booth/station rental does not)",
    "Signed independent contractor agreement on file for each artist (from the onboarding system)",
    "W-9 on file for each contractor before paying them"
  ]},
  { title: "Continuing Education", cite: "16 TAC §83.20 (CE rules)", items: [
    "Each practitioner's CE hours current for their next renewal \u2014 generally 4 hours (1 sanitation + 1 human trafficking + 2 elective) if licensed under 15 years, or 2 hours if licensed 15+ years",
    "CE completions reported and reflected in TDLR's system before renewal"
  ]},
  { title: "Facility", cite: "16 TAC §§83.71(g), 83.114", items: [
    "Sink with hot and cold running water in the area where services are performed and supplies are dispensed",
    "Covered waste receptacles at each station; trash emptied and lined daily",
    "Client and practitioner seating provided",
    "Ventilation (exhaust fan / air filtration) clears fumes and odors",
    "Restroom available on or near the premises; no chemicals stored in restroom",
    "Floors, walls, shelves and fixtures clean and in good repair",
    "Floors in wet areas or where chemicals are mixed are non-porous and easily washable",
    "Suitable plumbing with hot and cold running water at all times",
    "No food or beverages prepared on premises for sale (pre-packaged items to sell/offer clients are fine)",
    "Premises not used for living or sleeping",
    "Only service animals allowed on premises (a covered, sanitary aquarium is fine too) \u2014 emotional support animals do not qualify"
  ]},
  { title: "Required Postings", cite: "Tex. Occ. Code §1603.357, §1603.151, §1603.356; 16 TAC §83.71(l)", items: [
    "Barbering & Cosmetology Health and Safety Rules posted",
    "Current establishment license posted",
    "Notice that a copy of the most recent inspection report is available on request",
    "Consumer complaint sign posted",
    "Human Trafficking Awareness sign posted"
  ]},
  { title: "Nails-Specific Equipment", cite: "16 TAC §83.71(g), (h)(2)", items: [
    "Autoclave, dry heat sterilizer, or UV sanitizer on site",
    "One manicure station with sufficient lighting, per practitioner",
    "One manicure chair/stool and one client chair, per station"
  ]},
  { title: "Hair-Specific Equipment", cite: "16 TAC §83.71(h)(1)", items: [
    "One working station and one styling chair, per practitioner",
    "At least one shampoo bowl (required if offering shampooing or any service that permanently changes hair color or structure)"
  ]},
  { title: "Lashes-Specific Equipment", cite: "16 TAC §83.71(h)(5)", items: [
    "One facial bed, chair, or massage table per practitioner that allows the client to lie completely flat",
    "One lamp, one stool or chair, and one mirror, per practitioner"
  ]},
  { title: "Chemical & Product Safety", cite: "OSHA Hazard Communication Standard, 29 CFR 1910.1200; 16 TAC §83.102(n)", items: [
    "Safety Data Sheet (SDS) on file and accessible for every product in use",
    "All products properly labeled per OSHA requirements",
    "Staff know where the SDS binder/file is and how to read one"
  ]},
  { title: "Business Name & Tax", cite: "Tex. Bus. Orgs. Code Ch. 71 (Assumed Name); general Comptroller requirements", items: [
    "Legal business name is consistent across TDLR license, tax filings, and public branding \u2014 known open item: 2024 tax filing shows \u201cCio Bella\u201d (two L's) vs. \u201cCio Bela\u201d branding/domain; confirm which is correct and align everywhere",
    "Texas Sales and Use Tax Permit on file if selling retail products (product sales are taxable even when personal-care services generally are not)",
    "1099-NEC issued to each contractor earning $600+ in the year, by January 31"
  ]},
  { title: "Insurance (recommended, not TDLR-mandated)", cite: "General business risk management", items: [
    "General liability insurance active",
    "Professional liability (malpractice) coverage in place for services performed"
  ]},
  { title: "Tanning \u2014 Different Law", cite: "Tex. Health & Safety Code Ch. 145 (not TDLR)", items: [
    "Tanning is governed by a separate state law, not TDLR \u2014 tracked in its own site, not here"
  ]}
];

var REFERENCE_SECTIONS = [
  { title: "Establishment Licensing", cite: "Tex. Occ. Code §1603.2201, §1603.2103; 16 TAC §83.71", entries: [
    { rule: "Two license types you may need", text: "A Full-Service establishment license covers the broadest range of services (hair, skin, nails, waxing). Eyelash extension is its own separate establishment license category \u2014 it is not automatically bundled into a full-service license. Confirm the salon's actual license covers lashes; if it doesn't, that's a real licensing gap to close, not just a paperwork detail." },
    { rule: "Scope matters", text: "An establishment may not perform or offer a service outside the scope of its license (16 TAC §83.71(o)). Adding a new service to the menu means checking the license first, not after." },
    { rule: "Term", text: "Establishment licenses are generally valid for 2 years from issue. Track the renewal date proactively \u2014 TDLR does not always send reminders." }
  ]},
  { title: "Independent Contractors & Booth Rental", cite: "16 TAC §§83.71(c), (e); §83.50(b); TDLR 2024 rule change", entries: [
    { rule: "The 2024 change", text: "TDLR eliminated the separate \u201cbooth rental license\u201d in 2024. Today, a renter operating from an open booth or station just needs their own active individual TDLR license \u2014 no separate establishment-level permit for them." },
    { rule: "The mini-establishment exception", text: "That's different from a Mini-Establishment: if a contractor operates out of a fully enclosed, walled private room or suite (not just an open station), THAT space needs its own separate TDLR establishment license, held by whoever runs it. A traditional open chair/booth does not trigger this." },
    { rule: "Owner's ongoing duty", text: "You may not lease space to, or employ, anyone practicing cosmetology without a valid license (Tex. Occ. Code §1603.353(b)). Maintain a current list of every renter \u2014 name and license number \u2014 and produce it for an inspector on request. Verify each contractor's license status yourself at tdlr.texas.gov before they start, and periodically after." },
    { rule: "The renter's own duty", text: "A renter must independently comply with all sanitation laws and their own tax obligations as an independent entity \u2014 that responsibility doesn't transfer to you, but verifying their license status does." }
  ]},
  { title: "Continuing Education", cite: "16 TAC §83.20", entries: [
    { rule: "Standard requirement", text: "Licensed under 15 years: 4 CE hours per renewal cycle \u2014 1 hour sanitation, 1 hour human trafficking awareness, 2 hours elective." },
    { rule: "15+ year exemption", text: "Licensed 15 years or more: only 2 hours required." },
    { rule: "Reciprocal credit", text: "CE completed for one license can satisfy the requirement for another license the same person holds." }
  ]},
  { title: "Chemical & Product Safety (OSHA)", cite: "29 CFR 1910.1200; 16 TAC §83.102(n)", entries: [
    { rule: "Safety Data Sheets", text: "OSHA's Hazard Communication Standard requires an accessible SDS for every hazardous chemical product used in the salon \u2014 disinfectants, acrylics, dyes, removers, etc. Keep them in one place (binder or digital) staff actually know how to find." },
    { rule: "Labeling", text: "TDLR's own rule (§83.102(n)) separately requires all products used in the business to be properly labeled per OSHA requirements \u2014 this is both a TDLR inspection item and an OSHA one." }
  ]},
  { title: "Business Name Consistency", cite: "Tex. Bus. Orgs. Code Ch. 71", entries: [
    { rule: "Why this matters", text: "A mismatch between your legal business name (what's on tax filings and any DBA/Assumed Name Certificate) and what's on your TDLR establishment license or public branding can create real headaches \u2014 in tax audits, in contract disputes, in verifying the business's identity to a bank or inspector." },
    { rule: "Known open item", text: "The 2024 tax filing shows the legal name as \u201cCio Bella\u201d (two L's), while branding/domain use \u201cCio Bela.\u201d Worth resolving deliberately \u2014 either file an Assumed Name Certificate (DBA) for \u201cCio Bela\u201d if \u201cCio Bella\u201d is the true legal entity name, or correct the filings if \u201cCio Bela\u201d is actually correct. Whichever direction, get every document (TDLR license, tax filings, bank account, signage) saying the same thing." }
  ]},
  { title: "Sales Tax", cite: "Texas Comptroller general guidance", entries: [
    { rule: "Services vs. products", text: "Personal care services themselves (haircuts, manicures, waxing, lash sets) are generally not subject to Texas sales tax. Retail product sales (take-home nail polish, hair products, etc.) generally ARE taxable \u2014 if the salon sells any retail product, a Sales and Use Tax Permit and collection/remittance is required for those sales specifically." }
  ]},
  { title: "1099 Contractor Tax Filing", cite: "IRS general requirement", entries: [
    { rule: "Form 1099-NEC", text: "Any independent contractor paid $600 or more in a calendar year needs a 1099-NEC issued to them by January 31 of the following year, with a copy filed with the IRS. A current W-9 on file for each contractor makes this straightforward when the time comes." }
  ]},
  { title: "Insurance", cite: "Not a TDLR or state requirement \u2014 business risk management", entries: [
    { rule: "Why it's here anyway", text: "TDLR doesn't mandate salon insurance, but general liability (client injury on premises) and professional liability (a service that goes wrong) are standard protection for any salon, and some landlords or booth-rental agreements require proof of coverage. Worth tracking even though it's not a legal checklist item in the same sense as the rest of this page." }
  ]},
  { title: "Tanning Sits Outside This Whole Framework", cite: "Tex. Health & Safety Code Ch. 145", entries: [
    { rule: "Different agency, different law", text: "Tanning was never TDLR's jurisdiction and isn't part of the barbering/cosmetology license at all. It has its own compliance site covering age restriction, signage, the visit log, and Chapter 145's confidentiality rule." }
  ]}
];

function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

var siteQuery = "";

var TABS = [
  {path:"#/", label:"Home"},
  {path:"#/checklist", label:"Checklist"},
  {path:"#/reference", label:"Full Reference"}
];

function renderTabs(){
  var hash = location.hash || "#/";
  var html = TABS.map(function(t){
    var active = (t.path === "#/" ? hash === "#/" || hash === "" : hash.indexOf(t.path) === 0);
    return '<a class="tab' + (active ? ' active' : '') + '" href="' + t.path + '">' + t.label + '</a>';
  }).join("");
  document.getElementById("tabs").innerHTML = html;
}

function renderSearchbar(hash){
  var wrap = document.getElementById("searchbar-wrap");
  if (hash === "#/checklist" || hash === "#/reference") {
    wrap.innerHTML = '<input type="search" class="search-bar" id="site-search" placeholder="Search the whole admin site \u2014 licensing, contractors, tax, equipment, anything" value="' + esc(siteQuery) + '">';
    var input = document.getElementById("site-search");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    input.addEventListener("input", function(){
      siteQuery = input.value;
      renderCurrentTab();
    });
  } else {
    wrap.innerHTML = "";
  }
}

function renderCurrentTab(){
  var hash = location.hash || "#/";
  var app = document.getElementById("app");
  if (hash === "#/checklist") renderChecklist(app);
  else if (hash === "#/reference") renderReference(app);
  else renderHome(app);
}

function route(){
  renderTabs();
  var hash = location.hash || "#/";
  renderSearchbar(hash);
  renderCurrentTab();
}
window.addEventListener("hashchange", route);

function renderHome(app){
  app.innerHTML =
    '<h1>Owner Admin</h1>' +
    '<p class="lede">Everything legally required to run Cio Bela, across every service category, that\'s on you \u2014 not the artists. Licensing, contractors, facility, tax, and safety, all in one place. Nothing here is linked from any artist-facing site.</p>' +
    '<div class="card-grid">' +
      '<a class="card" href="#/checklist"><span class="tag">QUICK CHECK</span><h3>Checklist</h3><p>Establishment license, contractors, facility, postings, equipment by category, chemical safety, tax, and insurance.</p></a>' +
      '<a class="card" href="#/reference"><span class="tag">FULL REFERENCE</span><h3>Complete Guidance</h3><p>The full explanation behind every checklist item \u2014 why it matters and where it comes from.</p></a>' +
    '</div>' +
    '<div class="warn-note">Open item worth resolving: the 2024 tax filing name (\u201cCio Bella\u201d) doesn\'t match the \u201cCio Bela\u201d branding/domain. See Business Name &amp; Tax in the checklist.</div>' +
    '<h2 style="margin-top:44px;">Everything Built</h2>' +
    '<p class="lede">Every site from tonight, all in one place.</p>' +
    '<div class="card-grid">' +
      '<a class="card" href="https://shawntyd.github.io/cio-bela-nails-tdlr/" target="_blank"><span class="tag">CATEGORY</span><h3>Nails</h3><p>Checklist, Full Reference, and the required Foot Basin log.</p></a>' +
      '<a class="card" href="https://shawntyd.github.io/cio-bela-hair-tdlr/" target="_blank"><span class="tag">CATEGORY</span><h3>Hair</h3><p>Checklist and Full Reference.</p></a>' +
      '<a class="card" href="https://shawntyd.github.io/cio-bela-lashes-tdlr/" target="_blank"><span class="tag">CATEGORY</span><h3>Lashes</h3><p>Checklist and Full Reference.</p></a>' +
      '<a class="card" href="https://shawntyd.github.io/cio-bela-waxing-tdlr/" target="_blank"><span class="tag">CATEGORY</span><h3>Waxing</h3><p>Checklist and Full Reference.</p></a>' +
      '<a class="card" href="https://shawntyd.github.io/cio-bela-tanning-compliance/" target="_blank"><span class="tag">DIFFERENT LAW</span><h3>Tanning</h3><p>Check-in, passcode Visit Log, Checklist, Full Reference.</p></a>' +
      '<a class="card" href="https://shawntyd.github.io/cio-bela-tdlr-admin/" target="_blank"><span class="tag">YOU ARE HERE</span><h3>Owner Admin</h3><p>This site.</p></a>' +
    '</div>' +
    '<footer class="note">Built for Cio Bela Multi-Service Salon. This tool organizes recordkeeping; it does not replace reading the relevant statutes directly or consulting an attorney/accountant for anything tax- or entity-related.</footer>';
}

function renderChecklist(app){
  app.innerHTML = '<h1>Owner Compliance Checklist</h1>' +
    '<p class="lede">A running checklist across licensing, contractors, facility, postings, equipment, chemical safety, tax, and insurance.</p>' +
    '<div class="rule-note">Checks are shared and sync live across your own devices. This is a self-audit tool, not an official record.</div>' +
    '<div id="checklist-body">Loading…</div>';

  var body = document.getElementById("checklist-body");
  var itemIndex = 0;
  var allItems = [];
  CHECKLIST_GROUPS.forEach(function(g){ g.items.forEach(function(txt){ allItems.push({id: "i"+itemIndex, group: g.title, cite: g.cite, txt: txt}); itemIndex++; }); });

  var docRef = doc(db, "admin/checklist");
  onSnapshot(docRef, function(snap){
    var data = (snap.exists() && snap.data()) || {};
    var checked = data.items || {};
    var q = siteQuery.toLowerCase().trim();
    var html = "";
    var byGroup = {};
    allItems.forEach(function(it){ (byGroup[it.group] = byGroup[it.group] || []).push(it); });
    var any = false;
    CHECKLIST_GROUPS.forEach(function(g){
      var items = byGroup[g.title].filter(function(it){
        if (!q) return true;
        return (it.txt + ' ' + g.title + ' ' + g.cite).toLowerCase().indexOf(q) !== -1;
      });
      if (!items.length) return;
      any = true;
      html += '<section class="group"><h2>' + esc(g.title) + '</h2><div style="color:var(--text-soft);font-size:.78rem;margin-bottom:6px;">' + esc(g.cite) + '</div>';
      items.forEach(function(it){
        var isChecked = !!(checked[it.id] && checked[it.id].on);
        html += '<div class="item' + (isChecked ? ' checked' : '') + '">' +
          '<input type="checkbox" id="cb_' + it.id + '" ' + (isChecked ? 'checked' : '') + ' data-id="' + it.id + '">' +
          '<label for="cb_' + it.id + '">' + esc(it.txt) + '</label></div>';
      });
      html += '</section>';
    });
    body.innerHTML = any ? html : '<div class="empty-state">No checklist items match &ldquo;' + esc(siteQuery) + '&rdquo;.</div>';
    body.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var id = cb.getAttribute('data-id');
        var merged = {};
        merged[id] = { on: cb.checked, updatedAt: new Date().toISOString() };
        setDoc(docRef, { items: Object.assign({}, checked, merged) });
      });
    });
  }, function(err){
    body.innerHTML = '<p>Could not load checklist right now (' + esc(err.code || 'error') + '). Try reloading.</p>';
  });
}

function renderReference(app){
  app.innerHTML = '<h1>Full Reference — Owner Admin</h1>' +
    '<p class="lede">The complete explanation behind every checklist item.</p>' +
    '<div id="reference-body"></div>';
  var body = document.getElementById("reference-body");
  var q = siteQuery.toLowerCase().trim();
  var html = "";
  var any = false;
  REFERENCE_SECTIONS.forEach(function(sec){
    var matches = sec.entries.filter(function(e){
      if (!q) return true;
      return (e.rule + ' ' + e.text + ' ' + sec.title + ' ' + sec.cite).toLowerCase().indexOf(q) !== -1;
    });
    if (!matches.length) return;
    any = true;
    html += '<div class="ref-group"><h2>' + esc(sec.title) + '</h2><div class="cite">' + esc(sec.cite) + '</div>';
    matches.forEach(function(e){
      html += '<details class="ref"' + (q ? ' open' : '') + '><summary>' + esc(e.rule) + '</summary><div class="ref-body">' + esc(e.text) + '</div></details>';
    });
    html += '</div>';
  });
  body.innerHTML = any ? html : '<div class="empty-state">No reference entries match &ldquo;' + esc(siteQuery) + '&rdquo;.</div>';
}

route();
})();
</script>
</body>
</html>
